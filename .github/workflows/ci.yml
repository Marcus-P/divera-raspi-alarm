name: CI
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install -q -r app/requirements.txt pytest
      - run: python -m compileall -q app
      - run: PYTHONPATH=app pytest -q
      - run: find installer services -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Secret-pattern guard
        run: python scripts/check_secrets.py
