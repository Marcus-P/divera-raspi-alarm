name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate version, documentation and compatibility
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test "v$version" = "$GITHUB_REF_NAME"
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "Stable releases must be tagged from main"; exit 1; }
          grep -Fq "Dokumentationsstand: $version" docs/ANWENDERDOKUMENTATION.md
          grep -Fq "Dokumentationsstand: $version" docs/INSTALLATION.md
          python3 -m pip install -q -r app/requirements.txt pytest
          python3 -m compileall -q app
          python3 scripts/check_secrets.py
          PYTHONPATH=app pytest -q
          find installer services -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Require both manuals to change after the first release
        shell: bash
        run: |
          set -euo pipefail
          prev="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            if git diff --quiet "$prev"..HEAD -- docs/ANWENDERDOKUMENTATION.md; then echo "Anwenderdokumentation was not updated"; exit 1; fi
            if git diff --quiet "$prev"..HEAD -- docs/INSTALLATION.md; then echo "Installationsanleitung was not updated"; exit 1; fi
          fi
      - name: Build release artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/stage
          rsync -a --exclude '.git' --exclude 'dist' ./ dist/stage/
          tar -C dist/stage -czf "dist/divera-raspi-alarm-$GITHUB_REF_NAME.tar.gz" .
          cd dist
          sha256sum "divera-raspi-alarm-$GITHUB_REF_NAME.tar.gz" > SHA256SUMS
      - name: Create draft, upload assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes --verify-tag
          gh release upload "$GITHUB_REF_NAME" "dist/divera-raspi-alarm-$GITHUB_REF_NAME.tar.gz" dist/SHA256SUMS
          gh release edit "$GITHUB_REF_NAME" --draft=false
